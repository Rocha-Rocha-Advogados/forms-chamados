name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação por vez; a mais nova cancela a anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Declarar o ambiente é o que dá acesso às variáveis dele. Sem isto,
    # as variáveis criadas em Environments → github-pages chegam vazias
    # no build e o app abre avisando que falta configurar o Supabase.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O .env não vai para o repositório: as duas variáveis vêm de
      # Settings → Environments → github-pages → Environment variables.
      # A chave anon pode ser variável em vez de secret sem prejuízo —
      # ela vai publicada no JavaScript do site de qualquer forma; quem
      # protege os dados é o RLS, não o sigilo dela.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # falha cedo e com mensagem clara, em vez de publicar um app quebrado
      - name: Conferir que as variáveis chegaram
        run: |
          test -s dist/index.html || { echo '::error::build não gerou dist/index.html'; exit 1; }
          if grep -rqF 'placeholder.supabase.co' dist/assets; then
            echo '::error::VITE_SUPABASE_URL/ANON_KEY não chegaram ao build — confira Settings → Environments → github-pages → Environment variables'
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - id: publicar
        uses: actions/deploy-pages@v4
